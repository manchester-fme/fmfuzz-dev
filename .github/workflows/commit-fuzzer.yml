name: Commit Fuzzer

# Reusable, solver-agnostic commit-fuzzing workflow.
#
# Generalizes cvc5-commit-fuzzer.yml and z3-commit-fuzzer.yml. This is a
# genuine two-way differential-testing pair, not just duplicated code: cvc5
# uses z3 as its oracle, z3 uses cvc5 as its oracle, plus z3 needs an extra
# `z3test` repo and has a binary-caching optimization cvc5 doesn't. Same
# manifest-driven approach as coverage-mapper.yml (see that file's header
# for the full rationale) - every solver-specific fact (which solver is the
# oracle, how to fetch it, test root, resource limits, whether the SUT clone
# can be skipped when a binary is already available) is declared in
# src/solvers/<solver>/manifest.json's "fuzzer" section, not branched on
# `inputs.solver` in this file. That manifest (and its co-located build.sh)
# doesn't have to live in CAST at all - set solver_dir to a path inside your
# own solver checkout (e.g. myproject/cast-profile) to bring a wholly new
# solver without adding anything to this repo. Defaults to src/solvers/<solver>,
# so z3/cvc5 need no changes. prepare_commit_fuzzer.py/simple_commit_fuzzer.py
# themselves are CAST-owned (src/commit_fuzzer/) - solver-specific facts flow
# in as manifest-read CLI flags, not as a per-solver copy of these scripts.
#
# By default (no oracle_solver_dir), the oracle is the manifest-declared
# stable release of the oracle solver (e.g. cvc5's oracle is the z3-solver
# PyPI package - a released Z3, not a CAST-tracked commit build; symmetrically
# z3's oracle is a released cvc5). This is deliberate, not a fallback for a
# failed lookup: a continuously-rebuilt bleeding-edge oracle would make
# differential-testing failures harder to attribute, so the default targets
# something stable and versioned. Opting into a CAST/fork-tracked oracle
# build instead (e.g. z3's own profile living in z3's fork) is done by
# setting oracle_solver_dir (defaults to src/solvers/<oracle_solver>, same
# convention as solver_dir) - this only redirects the *tooling* used to
# interpret that downloaded build, not what gets downloaded (see below).
#
# Runnable standalone:
#   - From the GitHub UI/API: Actions -> Commit Fuzzer -> Run workflow
#   - From another workflow: uses: ./.github/workflows/commit-fuzzer.yml (workflow_call)
#
# State (build-queue/fuzzing-schedule reads, coverage-map reads, uploaded
# bug archives) is always namespaced by the calling repository
# (`github.repository`), same forced/top-level-prefix scheme as
# build.yml/manager.yml/coverage-mapper.yml. The oracle solver's binary is
# never namespaced - it always comes from the real upstream production
# build (or the manifest-declared fallback), regardless of who's calling,
# so a fork is always validated against the real oracle, not another fork.
#
# solver/repo_url are required - deliberately no default, so no caller can
# silently inherit another solver's state under this workflow's own (forced)
# namespace.

on:
  workflow_call:
    inputs:
      solver:
        description: 'Solver name (must have a src/solvers/<solver>/manifest.json)'
        required: true
        type: string
      repo_url:
        description: 'Git URL of the upstream solver repository to fuzz'
        required: true
        type: string
      commit_hash:
        description: 'Optional: commit hash to analyze (defaults to fuzzer-schedule selection)'
        required: false
        type: string
      coverage_commit_hash:
        description: 'Optional: commit hash to use for coverage mapping (defaults to latest in S3)'
        required: false
        type: string
      stop_buffer_minutes:
        description: 'Minutes before timeout to stop fuzzing'
        required: false
        type: number
        default: 5
      solver_dir:
        description: 'Directory containing manifest.json and build.sh for this solver. Defaults to src/solvers/<solver> (CAST-maintained solvers); set to a path inside your own solver checkout (e.g. <solver>/cast-profile) to bring a new solver without adding anything to CAST itself.'
        required: false
        type: string
        default: ''
      oracle_solver_dir:
        description: 'Opt into a CAST/fork-tracked commit build as the oracle instead of the manifest-declared stable release (the default when this is left empty). Directory containing manifest.json for the oracle solver declared in this solver''s manifest.json (e.g. z3, for cvc5); defaults to src/solvers/<oracle_solver>. Only redirects the tooling used to interpret the downloaded build - the oracle binary itself always comes from the real upstream production build, never from a fork.'
        required: false
        type: string
        default: ''
      oracle_repo_url:
        description: 'Git URL to clone the oracle solver from when oracle_solver_dir points inside that checkout (e.g. a separate fork carrying the oracle''s own cast-profile). Not needed when oracle_solver_dir is left at its default (src/solvers/<oracle_solver>) or otherwise already exists in the workspace. Only used to make oracle_solver_dir resolvable - never affects which oracle binary gets fetched.'
        required: false
        type: string
        default: ''
      max_jobs:
        description: 'Maximum number of parallel fuzzer-jobs matrix entries (GitHub Actions job fan-out for this run, not simple_commit_fuzzer.py''s separate --workers CPU-core flag). Overrides manifest.json fuzzer.resources.max_jobs for this run; falls back to that, then to 9, when left empty.'
        required: false
        type: number
      no_coverage:
        description: 'Fuzz every test in fuzzer.list_tests_command instead of the coverage-selected subset for this commit - skips downloading/requiring a coverage mapping and the libclang-based commit-diff analysis entirely. Useful before any coverage mapping exists yet, or for an occasional full-suite sweep.'
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      solver:
        description: 'Solver name (must have a src/solvers/<solver>/manifest.json)'
        required: true
        type: string
      repo_url:
        description: 'Git URL of the upstream solver repository to fuzz'
        required: true
        type: string
      commit_hash:
        description: 'Optional: commit hash to analyze (defaults to fuzzer-schedule selection)'
        required: false
        type: string
      coverage_commit_hash:
        description: 'Optional: commit hash to use for coverage mapping (defaults to latest in S3)'
        required: false
        type: string
      stop_buffer_minutes:
        description: 'Minutes before timeout to stop fuzzing'
        required: false
        type: number
        default: 5
      solver_dir:
        description: 'Directory containing manifest.json and build.sh for this solver. Defaults to src/solvers/<solver> (CAST-maintained solvers); set to a path inside your own solver checkout (e.g. <solver>/cast-profile) to bring a new solver without adding anything to CAST itself.'
        required: false
        type: string
        default: ''
      oracle_solver_dir:
        description: 'Opt into a CAST/fork-tracked commit build as the oracle instead of the manifest-declared stable release (the default when this is left empty). Directory containing manifest.json for the oracle solver declared in this solver''s manifest.json (e.g. z3, for cvc5); defaults to src/solvers/<oracle_solver>. Only redirects the tooling used to interpret the downloaded build - the oracle binary itself always comes from the real upstream production build, never from a fork.'
        required: false
        type: string
        default: ''
      oracle_repo_url:
        description: 'Git URL to clone the oracle solver from when oracle_solver_dir points inside that checkout (e.g. a separate fork carrying the oracle''s own cast-profile). Not needed when oracle_solver_dir is left at its default (src/solvers/<oracle_solver>) or otherwise already exists in the workspace. Only used to make oracle_solver_dir resolvable - never affects which oracle binary gets fetched.'
        required: false
        type: string
        default: ''
      max_jobs:
        description: 'Maximum number of parallel fuzzer-jobs matrix entries (GitHub Actions job fan-out for this run, not simple_commit_fuzzer.py''s separate --workers CPU-core flag). Overrides manifest.json fuzzer.resources.max_jobs for this run; falls back to that, then to 9, when left empty.'
        required: false
        type: number
      no_coverage:
        description: 'Fuzz every test in fuzzer.list_tests_command instead of the coverage-selected subset for this commit - skips downloading/requiring a coverage mapping and the libclang-based commit-diff analysis entirely. Useful before any coverage mapping exists yet, or for an occasional full-suite sweep.'
        required: false
        type: boolean

jobs:
  check-latest-build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      fuzzing_needed: ${{ steps.set-outputs.outputs.fuzzing_needed }}
      sha: ${{ steps.set-outputs.outputs.sha }}
      commit_to_fuzz: ${{ steps.set-outputs.outputs.commit_to_fuzz }}
      latest_build: ${{ steps.set-outputs.outputs.latest_build }}
      is_manual_run: ${{ steps.set-outputs.outputs.is_manual_run }}
      binary_available: ${{ steps.set-outputs.outputs.binary_available }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3 requests

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}
          r2_broker_function_url: 'https://e7gghvi6g5gw4gaszvu5wrou6i0annob.lambda-url.eu-north-1.on.aws/'  # see src/infra/r2-broker/README.md
          r2_broker_role_arn: 'arn:aws:iam::615930035042:role/service-role/cast-r2-broker-role-ro68mail'  # see src/infra/r2-broker/README.md
          r2_broker_region: 'eu-north-1'  # see src/infra/r2-broker/README.md

      - name: Get commit to fuzz and latest build
        id: set-outputs
        run: |
          set +e  # Don't exit on error - handle errors gracefully
          SOLVER="${{ inputs.solver }}"
          NAMESPACE="${{ github.repository }}"
          # If workflow_dispatch with commit hash provided, use that commit
          # Otherwise (scheduled OR workflow_dispatch without commit), use fuzzer to select
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.commit_hash }}" ]; then
            COMMIT_TO_FUZZ="${{ inputs.commit_hash }}"
            # For manual runs, get latest build to use
            echo "🔍 Attempting to get latest build from S3..."
            LATEST_BUILD=$(python -c "from src.scheduling.s3_state import get_state_manager; m = get_state_manager('$SOLVER', namespace='$NAMESPACE'); print(m.get_latest_available_build() or '')" 2>&1)
            PYTHON_EXIT=$?
            echo "DEBUG: Python exit code: $PYTHON_EXIT"
            echo "DEBUG: LATEST_BUILD result: '${LATEST_BUILD}'"
            # Extract just the commit hash (last line, filter out debug messages)
            LATEST_BUILD=$(echo "$LATEST_BUILD" | grep -E '^[a-f0-9]{40}$' | tail -1 || echo '')
            if [ -z "$LATEST_BUILD" ]; then
              echo "⚠️  No latest build available, using provided commit as build"
              LATEST_BUILD="$COMMIT_TO_FUZZ"
            fi
            echo "🔨 Using provided commit: $COMMIT_TO_FUZZ with build: $LATEST_BUILD"
            echo "fuzzing_needed=true" >> $GITHUB_OUTPUT
            echo "commit_to_fuzz=$COMMIT_TO_FUZZ" >> $GITHUB_OUTPUT
            echo "latest_build=$LATEST_BUILD" >> $GITHUB_OUTPUT
            echo "sha=$COMMIT_TO_FUZZ" >> $GITHUB_OUTPUT
            echo "is_manual_run=true" >> $GITHUB_OUTPUT
            echo "binary_available=true" >> $GITHUB_OUTPUT
          else
            # Scheduled run OR workflow_dispatch without commit - use fuzzer to select
            echo "🔍 Running fuzzer.py to select commit..."
            PYTHONPATH="${{ github.workspace }}" python src/scheduling/fuzzer.py "$SOLVER" --namespace "$NAMESPACE" select >/tmp/fuzzer_stdout.txt 2>/tmp/fuzzer_stderr.txt || true
            RESULT=$(cat /tmp/fuzzer_stdout.txt 2>/dev/null || echo "")
            STDERR_OUTPUT=$(cat /tmp/fuzzer_stderr.txt 2>/dev/null || echo "")
            echo "=== Fuzzer Debug Output ==="
            if [ -n "$STDERR_OUTPUT" ]; then
              echo "$STDERR_OUTPUT"
            else
              echo "(no stderr output)"
            fi
            echo "=== Fuzzer Result (stdout) ==="
            echo "Result: '$RESULT'"
            if [ -n "$RESULT" ] && [ "$(echo "$RESULT" | wc -w)" -eq 2 ]; then
              COMMIT_TO_FUZZ=$(echo "$RESULT" | awk '{print $1}')
              LATEST_BUILD=$(echo "$RESULT" | awk '{print $2}')
              echo "✅ Found commit to fuzz: $COMMIT_TO_FUZZ, using latest build: $LATEST_BUILD"
              echo "fuzzing_needed=true" >> $GITHUB_OUTPUT
              echo "commit_to_fuzz=$COMMIT_TO_FUZZ" >> $GITHUB_OUTPUT
              echo "latest_build=$LATEST_BUILD" >> $GITHUB_OUTPUT
              echo "sha=$COMMIT_TO_FUZZ" >> $GITHUB_OUTPUT
              echo "is_manual_run=false" >> $GITHUB_OUTPUT
              echo "binary_available=true" >> $GITHUB_OUTPUT
            else
              echo "⏭️  No commits in fuzzing schedule or no builds available"
              echo "fuzzing_needed=false" >> $GITHUB_OUTPUT
              echo "commit_to_fuzz=" >> $GITHUB_OUTPUT
              echo "latest_build=" >> $GITHUB_OUTPUT
              echo "sha=" >> $GITHUB_OUTPUT
              echo "is_manual_run=false" >> $GITHUB_OUTPUT
              echo "binary_available=false" >> $GITHUB_OUTPUT
            fi
          fi

  skip-fuzzing:
    needs: check-latest-build
    if: |
      needs.check-latest-build.outputs.fuzzing_needed == 'false' || needs.check-latest-build.outputs.binary_available == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Skip fuzzing
        run: |
          if [ "${{ needs.check-latest-build.outputs.fuzzing_needed }}" == "false" ]; then
            echo "✅ No builds available - skipping fuzzing"
          else
            echo "❌ Production binary not available - skipping fuzzing"
          fi

  commit-fuzzer:
    needs: check-latest-build
    if: |
      needs.check-latest-build.outputs.fuzzing_needed == 'true' && needs.check-latest-build.outputs.binary_available == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.extract-tests.outputs.matrix }}
      total_tests: ${{ steps.extract-tests.outputs.total_tests }}
      total_jobs: ${{ steps.extract-tests.outputs.total_jobs }}
      commit_hash: ${{ steps.get-commit.outputs.commit_hash }}
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Install LLVM/Clang 17
        if: inputs.no_coverage != true
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '17'

      - name: Add LLVM to PATH
        if: inputs.no_coverage != true
        run: echo "${{ env.LLVM_PATH }}/bin" >> $GITHUB_PATH

      - name: Export LIBCLANG_PATH
        if: inputs.no_coverage != true
        run: echo "LIBCLANG_PATH=${{ env.LLVM_PATH }}/lib" >> $GITHUB_ENV

      - name: Install system development packages
        if: inputs.no_coverage != true
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libc6-dev \
            gcc \
            g++ \
            binutils \
            libstdc++-14-dev \
            libc++-dev \
            libc++abi-dev \
            zlib1g \
            zlib1g-dev

      - name: Install Python dependencies
        run: |
          pip install gitpython unidiff "libclang==17.0.6"

      - uses: ./.github/actions/clone-solver-source
        with:
          solver: ${{ inputs.solver }}
          repo_url: ${{ inputs.repo_url }}

      - name: Clone manifest-declared extra repos
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            dir=$(basename "$repo" .git)
            if [ -d "$dir" ]; then
              echo "$dir already exists, skipping clone"
            else
              git clone "$repo" "$dir"
            fi
          done < <(jq -r '.fuzzer.extra_repos[]' "$MANIFEST")

      - name: Checkout commit to fuzz
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          COMMIT_TO_FUZZ="${{ needs.check-latest-build.outputs.commit_to_fuzz }}"
          echo "🔨 Checking out commit to fuzz: $COMMIT_TO_FUZZ"
          # solver_dir may point inside the SUT checkout (e.g. "$SOLVER/.cast")
          # for external solvers bringing their own manifest.json/build.sh.
          # That profile lives on the default branch, not necessarily at
          # every historical commit, so back it up and restore it across the
          # checkout below instead of letting `git checkout` silently wipe it
          # out whenever COMMIT_TO_FUZZ predates it.
          CAST_PROFILE_BACKUP=""
          case "$SOLVER_DIR" in
            "$SOLVER"/*)
              if [ -d "$SOLVER_DIR" ]; then
                CAST_PROFILE_BACKUP=$(mktemp -d)
                cp -r "$SOLVER_DIR" "$CAST_PROFILE_BACKUP/profile"
              fi
              ;;
          esac
          (cd "$SOLVER" && git fetch origin && git checkout "$COMMIT_TO_FUZZ" && echo "Checked out commit: $(git rev-parse HEAD)")
          if [ -n "$CAST_PROFILE_BACKUP" ]; then
            rm -rf "$SOLVER_DIR"
            mkdir -p "$(dirname "$SOLVER_DIR")"
            cp -r "$CAST_PROFILE_BACKUP/profile" "$SOLVER_DIR"
            rm -rf "$CAST_PROFILE_BACKUP"
          fi

      - name: Get solver commit hash
        id: get-commit
        run: |
          COMMIT_HASH=$(cd "${{ inputs.solver }}" && git rev-parse HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "${{ inputs.solver }} commit hash: $COMMIT_HASH"

      - name: Configure storage backend
        if: inputs.no_coverage != true
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}
          r2_broker_function_url: 'https://e7gghvi6g5gw4gaszvu5wrou6i0annob.lambda-url.eu-north-1.on.aws/'  # see src/infra/r2-broker/README.md
          r2_broker_role_arn: 'arn:aws:iam::615930035042:role/service-role/cast-r2-broker-role-ro68mail'  # see src/infra/r2-broker/README.md
          r2_broker_region: 'eu-north-1'  # see src/infra/r2-broker/README.md

      - name: Download production binary from S3 (for headers and compile_commands.json)
        id: download-production-binary
        if: inputs.no_coverage != true
        continue-on-error: true
        run: |
          SOLVER="${{ inputs.solver }}"
          NAMESPACE="${{ github.repository }}"
          mkdir -p artifacts
          LATEST_BUILD="${{ needs.check-latest-build.outputs.latest_build }}"
          S3_KEY="$NAMESPACE/solvers/$SOLVER/builds/v2/production/${LATEST_BUILD}.tar.gz"

          if [ "${AWS_STORAGE_PROVIDER:-}" = "r2-broker" ]; then
            HEAD_OK=0; $GITHUB_WORKSPACE/src/util/r2_broker_cli.sh head "$NAMESPACE" "$S3_KEY" || HEAD_OK=1
          else
            HEAD_OK=0; aws s3api head-object --bucket $AWS_BUCKET_NAME --key "$S3_KEY" >/dev/null 2>&1 || HEAD_OK=1
          fi

          if [ "$HEAD_OK" = "0" ]; then
            echo "📥 Downloading production binary for latest build: $LATEST_BUILD (for headers and compile_commands.json)"
            if [ "${AWS_STORAGE_PROVIDER:-}" = "r2-broker" ]; then
              $GITHUB_WORKSPACE/src/util/r2_broker_cli.sh get "$NAMESPACE" "$S3_KEY" artifacts/artifacts.tar.gz
            else
              aws s3 cp s3://$AWS_BUCKET_NAME/$S3_KEY artifacts/artifacts.tar.gz
            fi
            echo "artifacts_available=true" >> $GITHUB_OUTPUT
          else
            echo "WARNING: Production binary not found in S3 for $LATEST_BUILD, will build as fallback"
            echo "artifacts_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract headers and compile_commands.json
        id: extract-artifacts
        if: inputs.no_coverage != true && steps.download-production-binary.outputs.artifacts_available == 'true'
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          if [ -f "artifacts/artifacts.tar.gz" ]; then
            BINARY_RELPATH=$(jq -r '.fuzzer.target_binary_path' "$SOLVER_DIR/manifest.json" | sed 's#^\./build/##')
            "$GITHUB_WORKSPACE/src/util/extract_build_artifacts.sh" artifacts/artifacts.tar.gz $SOLVER/build "$BINARY_RELPATH" true
            if [ -f "$SOLVER/build/compile_commands.json" ]; then
              echo "✅ Headers and compile_commands.json extracted successfully"
              echo "artifacts_available=true" >> $GITHUB_OUTPUT
            else
              echo "⚠️ compile_commands.json extraction failed"
              echo "artifacts_available=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "artifacts_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Build solver static binary (fallback for headers and compile_commands.json)
        if: inputs.no_coverage != true && steps.extract-artifacts.outputs.artifacts_available != 'true'
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          if [ ! -f "$SOLVER/build/compile_commands.json" ]; then
            echo "🔨 Building $SOLVER static binary as fallback to get headers and compile_commands.json"
            "$SOLVER_DIR/build.sh" --static
          else
            echo "✅ Using artifacts from S3, skipping build"
          fi

      - name: Configure storage backend for coverage download
        if: inputs.no_coverage != true
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}
          r2_broker_function_url: 'https://e7gghvi6g5gw4gaszvu5wrou6i0annob.lambda-url.eu-north-1.on.aws/'  # see src/infra/r2-broker/README.md
          r2_broker_role_arn: 'arn:aws:iam::615930035042:role/service-role/cast-r2-broker-role-ro68mail'  # see src/infra/r2-broker/README.md
          r2_broker_region: 'eu-north-1'  # see src/infra/r2-broker/README.md

      - name: Download coverage map from S3
        id: download-coverage
        if: inputs.no_coverage != true
        run: |
          SOLVER="${{ inputs.solver }}"
          NAMESPACE="${{ github.repository }}"
          PREFIX="$NAMESPACE/solvers/$SOLVER/coverage-mappings"
          BROKER="${AWS_STORAGE_PROVIDER:-}"

          if [ -n "${{ inputs.coverage_commit_hash }}" ]; then
            COVERAGE_COMMIT="${{ inputs.coverage_commit_hash }}"
            S3_KEY="$PREFIX/coverage_mapping-${COVERAGE_COMMIT}.json.gz"
            if [ "$BROKER" = "r2-broker" ]; then
              HEAD_OK=0; $GITHUB_WORKSPACE/src/util/r2_broker_cli.sh head "$NAMESPACE" "$S3_KEY" || HEAD_OK=1
            else
              HEAD_OK=0; aws s3api head-object --bucket $AWS_BUCKET_NAME --key "$S3_KEY" >/dev/null 2>&1 || HEAD_OK=1
            fi
            if [ "$HEAD_OK" = "0" ]; then
              echo "📥 Downloading coverage mapping for commit: ${COVERAGE_COMMIT}"
              if [ "$BROKER" = "r2-broker" ]; then
                $GITHUB_WORKSPACE/src/util/r2_broker_cli.sh get "$NAMESPACE" "$S3_KEY" coverage_mapping.json.gz
              else
                aws s3 cp s3://$AWS_BUCKET_NAME/$S3_KEY coverage_mapping.json.gz
              fi
              echo "coverage_found=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Coverage mapping not found for commit: ${COVERAGE_COMMIT}"
              echo "coverage_found=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "🔍 Finding latest coverage mapping in S3..."
            if [ "$BROKER" = "r2-broker" ]; then
              $GITHUB_WORKSPACE/src/util/r2_broker_cli.sh list "$NAMESPACE" "$PREFIX/" listing.xml
              # Filenames are coverage_mapping-<commit-sha>.json.gz - sorting
              # by filename (as this used to do) sorts by hash, not by time,
              # and can silently pick an old/unrelated mapping over the
              # actual latest one. Pick by <LastModified> instead (also
              # undoing R2's percent-encoding of <Key>, e.g. "/" -> "%2F",
              # since presigned list_objects_v2 URLs always request
              # encoding-type=url).
              LATEST=$(python3 -c $'import re, urllib.parse\nxml = open("listing.xml").read()\nents = [(lm, urllib.parse.unquote(k)) for k, lm in re.findall(r"<Key>([^<]+)</Key>.*?<LastModified>([^<]+)</LastModified>", xml, re.S)]\nents = [e for e in ents if "coverage_mapping-" in e[1]]\nprint(max(ents)[1].rsplit("/", 1)[-1] if ents else "")' || echo "")
            else
              LATEST=$(aws s3 ls s3://$AWS_BUCKET_NAME/$PREFIX/ \
                | grep "coverage_mapping-" \
                | sort -r \
                | head -n 1 \
                | awk '{print $4}' || echo "")
            fi
            if [ -n "$LATEST" ]; then
              echo "📥 Downloading latest coverage mapping: $LATEST"
              if [ "$BROKER" = "r2-broker" ]; then
                $GITHUB_WORKSPACE/src/util/r2_broker_cli.sh get "$NAMESPACE" "$PREFIX/$LATEST" coverage_mapping.json.gz
              else
                aws s3 cp s3://$AWS_BUCKET_NAME/$PREFIX/$LATEST coverage_mapping.json.gz
              fi
              echo "coverage_found=true" >> $GITHUB_OUTPUT
              echo "coverage_file=$LATEST" >> $GITHUB_OUTPUT
            else
              echo "❌ No coverage mappings found in S3"
              echo "coverage_found=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Extract coverage map
        if: inputs.no_coverage != true && steps.download-coverage.outputs.coverage_found == 'true'
        run: |
          gunzip coverage_mapping.json.gz
          ls -la coverage_mapping.json
          echo "✅ Coverage mapping extracted successfully"

      - name: Coverage mapping not found
        if: inputs.no_coverage != true && steps.download-coverage.outputs.coverage_found != 'true'
        run: |
          echo "❌ Coverage mapping not found. Please run the coverage mapper workflow first or specify a valid coverage_commit_hash."
          exit 1

      - name: Run Commit Fuzzer and create matrix
        id: extract-tests
        env:
          SKIP_COVERAGE_ENFORCEMENT: "true"
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$GITHUB_WORKSPACE/$SOLVER_DIR/manifest.json"

          # Precedence: explicit workflow input > manifest-declared default > 9.
          # An omitted `number`-typed workflow_call/workflow_dispatch input
          # resolves to "0", not "" - callers that don't set max_jobs (the
          # common case) would otherwise pin MAX_JOBS at 0 here and crash
          # downstream, so treat 0 the same as unset (max_jobs=0 wouldn't be
          # a meaningful value for a caller to request anyway).
          MAX_JOBS="${{ inputs.max_jobs }}"
          if [ -z "$MAX_JOBS" ] || [ "$MAX_JOBS" = "0" ]; then
            MAX_JOBS=$(jq -r '.fuzzer.resources.max_jobs // empty' "$MANIFEST")
          fi
          if [ -z "$MAX_JOBS" ] || [ "$MAX_JOBS" = "0" ]; then
            MAX_JOBS=9
          fi

          # Jobs capped at MAX_JOBS to leave space for building and management.
          # Tests per job is calculated dynamically to fit within MAX_JOBS.
          # prepare_commit_fuzzer.py/run_prepare_commit_fuzzer.sh are CAST-owned
          # (src/commit_fuzzer/) - solver-specific facts flow in as manifest-read
          # flags below, not as a per-solver copy of these scripts in solver_dir.
          if [ "${{ inputs.no_coverage }}" = "true" ]; then
            # Fuzz every test in the solver's seed corpus - no coverage
            # mapping or libclang-based commit-diff analysis needed at all.
            LIST_TESTS_COMMAND=$(jq -r '.fuzzer.list_tests_command' "$MANIFEST")
            (cd "$SOLVER" && eval "$LIST_TESTS_COMMAND") > all_tests.txt
            echo "📋 No-coverage mode: found $(wc -l < all_tests.txt) tests to fuzz"

            cd "$SOLVER"
            python3 "$GITHUB_WORKSPACE/src/commit_fuzzer/prepare_commit_fuzzer.py" \
              "${{ steps.get-commit.outputs.commit_hash }}" \
              --tests-file ../all_tests.txt \
              --output-matrix fuzzer_matrix.json \
              --max-jobs $MAX_JOBS
          else
            NAMESPACE_PREFIX=$(jq -r '.fuzzer.namespace_prefix // empty' "$MANIFEST")
            CLANG_ARGS_JSON=$(jq -c '.fuzzer.clang_args // []' "$MANIFEST")

            cd "$SOLVER"
            "$GITHUB_WORKSPACE/src/commit_fuzzer/run_prepare_commit_fuzzer.sh" \
              --python-script "$GITHUB_WORKSPACE/src/commit_fuzzer/prepare_commit_fuzzer.py" \
              --coverage-file ../coverage_mapping.json \
              --compile-commands build \
              --output-matrix fuzzer_matrix.json \
              --max-jobs $MAX_JOBS \
              --commit-hash "${{ steps.get-commit.outputs.commit_hash }}" \
              --namespace-prefix "$NAMESPACE_PREFIX" \
              --clang-args-json "$CLANG_ARGS_JSON" \
              1
          fi

          if [ ! -f "fuzzer_matrix.json" ]; then
            echo "No matrix file created (no functions found or no tests), setting empty outputs"
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "total_tests=0" >> $GITHUB_OUTPUT
            echo "total_jobs=0" >> $GITHUB_OUTPUT
            echo "✅ No functions to fuzz - ending gracefully"
          else
            MATRIX=$(jq -c '.matrix' fuzzer_matrix.json)
            TOTAL_TESTS=$(jq -r '.total_tests' fuzzer_matrix.json)
            TOTAL_JOBS=$(jq -r '.total_jobs' fuzzer_matrix.json)
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
            echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
            echo "total_jobs=$TOTAL_JOBS" >> $GITHUB_OUTPUT
            echo "Matrix created with $TOTAL_JOBS jobs for $TOTAL_TESTS tests"
          fi

  fuzzer-jobs:
    needs: [check-latest-build, commit-fuzzer]
    if: needs.commit-fuzzer.result == 'success' && needs.commit-fuzzer.outputs.total_tests != '' && needs.commit-fuzzer.outputs.total_tests != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.commit-fuzzer.outputs.matrix) }}
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Record job start time
        run: echo "$(date +%s)" > /tmp/job_start_${GITHUB_RUN_ID}_${{ matrix.job_id }}.txt

      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip unzip wget
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      # This job normally skips cloning the full solver repo when a cached
      # binary is available (see "Clone/build SUT if needed" below) - fine
      # when manifest/scripts live in CAST's own src/solvers/, but a
      # solver_dir pointing inside the solver's own checkout needs that
      # checkout to exist before any of the manifest reads further down.
      - uses: ./.github/actions/clone-solver-source
        if: inputs.solver_dir != ''
        with:
          solver: ${{ inputs.solver }}
          repo_url: ${{ inputs.repo_url }}

      - name: Install fuzzing dependencies
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          pip install antlr4-python3-runtime==4.9.2
          pip install psutil
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            pip install "$pkg"
          done < <(jq -r '.fuzzer.extra_pip_packages[]' "$MANIFEST")
          git clone --branch v0.3.1 --depth 1 https://github.com/testsmt/yinyang.git
          cd yinyang
          pip install -e .
          cd ..
          pip cache purge || true

      - name: Clone manifest-declared extra repos
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            dir=$(basename "$repo" .git)
            if [ -d "$dir" ]; then
              echo "$dir already exists, skipping clone"
            else
              git clone "$repo" "$dir"
            fi
          done < <(jq -r '.fuzzer.extra_repos[]' "$MANIFEST")

      - name: Clone oracle solver repo early if oracle_solver_dir needs it
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          ORACLE_SOLVER=$(jq -r '.fuzzer.oracle_solver // empty' "$SOLVER_DIR/manifest.json")
          ORACLE_SOLVER_DIR="${{ inputs.oracle_solver_dir }}"
          ORACLE_REPO_URL="${{ inputs.oracle_repo_url }}"
          # Mirrors "Clone solver repo early if solver_dir needs it" above but
          # for the oracle side: oracle_solver_dir pointing inside its own
          # checkout (e.g. a separate fork carrying the oracle's cast-profile)
          # needs that checkout to exist before "Fetch oracle binary from S3"
          # reads its manifest.json. Only clones source to reach the profile
          # files - the oracle binary itself is still always fetched from the
          # real production build below, never built from this clone.
          if [ -n "$ORACLE_SOLVER" ] && [ -n "$ORACLE_SOLVER_DIR" ] && [ -n "$ORACLE_REPO_URL" ] && [ ! -d "$ORACLE_SOLVER" ]; then
            # Shallow clone - unlike the SUT clone above, this only needs to
            # reach two small profile files, not a buildable source tree.
            git clone --depth 1 "$ORACLE_REPO_URL" "$ORACLE_SOLVER"
          fi

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}
          r2_broker_function_url: 'https://e7gghvi6g5gw4gaszvu5wrou6i0annob.lambda-url.eu-north-1.on.aws/'  # see src/infra/r2-broker/README.md
          r2_broker_role_arn: 'arn:aws:iam::615930035042:role/service-role/cast-r2-broker-role-ro68mail'  # see src/infra/r2-broker/README.md
          r2_broker_region: 'eu-north-1'  # see src/infra/r2-broker/README.md

      - name: Fetch oracle binary from S3
        id: fetch-oracle
        continue-on-error: true
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          ORACLE_SOLVER=$(jq -r '.fuzzer.oracle_solver // empty' "$MANIFEST")
          echo "oracle_solver=$ORACLE_SOLVER" >> $GITHUB_OUTPUT
          if [ -z "$ORACLE_SOLVER" ]; then
            echo "No oracle declared for $SOLVER"
            echo "oracle_binary_available=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          ORACLE_SOLVER_DIR="${{ inputs.oracle_solver_dir }}"
          if [ -z "$ORACLE_SOLVER_DIR" ]; then
            # No explicit oracle_solver_dir means no one configured a CAST-hosted
            # or forked profile for $ORACLE_SOLVER to interpret a production S3
            # build with - go straight to the manifest's declared stable-release
            # oracle (oracle_fetch_fallback) rather than attempting a build we
            # have no way to unpack. This is deliberate, not just "S3 lookup
            # failed": the oracle is the released version of $ORACLE_SOLVER by
            # default, a CAST/fork-tracked commit build is the opt-in case.
            echo "No oracle_solver_dir set - using the manifest-declared stable release of $ORACLE_SOLVER"
            echo "oracle_binary_available=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🔍 Getting latest $ORACLE_SOLVER build from S3 (oracle, unnamespaced)..."
          LATEST_ORACLE_BUILD=$(python -c "from src.scheduling.s3_state import get_state_manager; m = get_state_manager('$ORACLE_SOLVER'); print(m.get_latest_available_build() or '')" 2>&1)
          LATEST_ORACLE_BUILD=$(echo "$LATEST_ORACLE_BUILD" | grep -E '^[a-f0-9]{40}$' | tail -1 || echo '')
          if [ -z "$LATEST_ORACLE_BUILD" ]; then
            echo "⚠️  No latest $ORACLE_SOLVER build available"
            echo "oracle_binary_available=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          mkdir -p artifacts-oracle
          S3_KEY="solvers/$ORACLE_SOLVER/builds/v2/production/${LATEST_ORACLE_BUILD}.tar.gz"
          # Oracle data is always the real, unnamespaced production build -
          # readable by any caller regardless of namespace (see
          # src/infra/r2-broker/lambda_function.py), so the broker calls below
          # pass an empty namespace deliberately, not github.repository.
          if [ "${AWS_STORAGE_PROVIDER:-}" = "r2-broker" ]; then
            HEAD_OK=0; $GITHUB_WORKSPACE/src/util/r2_broker_cli.sh head "" "$S3_KEY" || HEAD_OK=1
          else
            HEAD_OK=0; aws s3api head-object --bucket $AWS_BUCKET_NAME --key "$S3_KEY" >/dev/null 2>&1 || HEAD_OK=1
          fi
          if [ "$HEAD_OK" != "0" ]; then
            echo "WARNING: $ORACLE_SOLVER production binary not found in S3 at key: $S3_KEY"
            echo "oracle_binary_available=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${AWS_STORAGE_PROVIDER:-}" = "r2-broker" ]; then
            GET_OK=0; $GITHUB_WORKSPACE/src/util/r2_broker_cli.sh get "" "$S3_KEY" artifacts-oracle/artifacts.tar.gz || GET_OK=1
          else
            GET_OK=0; aws s3 cp s3://$AWS_BUCKET_NAME/$S3_KEY artifacts-oracle/artifacts.tar.gz || GET_OK=1
          fi
          if [ "$GET_OK" != "0" ]; then
            echo "❌ $ORACLE_SOLVER binary download failed"
            echo "oracle_binary_available=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          ORACLE_BINARY_RELPATH=$(jq -r '.fuzzer.target_binary_path' "$ORACLE_SOLVER_DIR/manifest.json" | sed 's#^\./##')
          ORACLE_BUILD_DIR_RELPATH=$(jq -r '.fuzzer.target_binary_path' "$ORACLE_SOLVER_DIR/manifest.json" | sed 's#^\./build/##')
          mkdir -p "$ORACLE_SOLVER/build"
          "$GITHUB_WORKSPACE/src/util/extract_build_artifacts.sh" artifacts-oracle/artifacts.tar.gz $ORACLE_SOLVER/build "$ORACLE_BUILD_DIR_RELPATH" false
          if [ ! -f "$ORACLE_SOLVER/$ORACLE_BINARY_RELPATH" ]; then
            echo "⚠️ $ORACLE_SOLVER binary extraction failed"
            echo "oracle_binary_available=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          mkdir -p "$GITHUB_WORKSPACE/oracle-bin"
          cp "$ORACLE_SOLVER/$ORACLE_BINARY_RELPATH" "$GITHUB_WORKSPACE/oracle-bin/$ORACLE_SOLVER"
          chmod +x "$GITHUB_WORKSPACE/oracle-bin/$ORACLE_SOLVER"
          echo "$GITHUB_WORKSPACE/oracle-bin" >> $GITHUB_PATH
          rm -f artifacts-oracle/artifacts.tar.gz
          echo "✅ $ORACLE_SOLVER oracle binary ready"
          echo "oracle_binary_available=true" >> $GITHUB_OUTPUT

      - name: Install oracle fallback if unavailable
        if: steps.fetch-oracle.outputs.oracle_binary_available != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          ORACLE_SOLVER="${{ steps.fetch-oracle.outputs.oracle_solver }}"
          FALLBACK_TYPE=$(jq -r '.fuzzer.oracle_fetch_fallback.type' "$MANIFEST")
          echo "⚠️ $ORACLE_SOLVER binary from S3 not available, using fallback ($FALLBACK_TYPE)"
          if [ "$FALLBACK_TYPE" = "pip" ]; then
            PACKAGE=$(jq -r '.fuzzer.oracle_fetch_fallback.package' "$MANIFEST")
            pip install "$PACKAGE"
          elif [ "$FALLBACK_TYPE" = "script" ]; then
            SCRIPT=$(jq -r '.fuzzer.oracle_fetch_fallback.path' "$MANIFEST")
            pip install requests
            mkdir -p "$GITHUB_WORKSPACE/oracle-bin"
            python3 "$SCRIPT" "$GITHUB_WORKSPACE/oracle-bin"
            echo "$GITHUB_WORKSPACE/oracle-bin" >> $GITHUB_PATH
          elif [ "$FALLBACK_TYPE" = "github_release" ]; then
            # Same generic downloader coverage-mapper.yml uses for
            # coverage.oracle_fetch - for a solver with no reliable pip CLI
            # package (e.g. cvc5, unlike z3-solver), fetch its own latest
            # GitHub release instead of writing a per-solver script.
            REPO=$(jq -r '.fuzzer.oracle_fetch_fallback.repo' "$MANIFEST")
            ASSET_KEYWORDS=$(jq -r '.fuzzer.oracle_fetch_fallback.asset_keywords | join(",")' "$MANIFEST")
            BINARY_NAME=$(jq -r '.fuzzer.oracle_fetch_fallback.binary_name' "$MANIFEST")
            pip install requests
            mkdir -p "$GITHUB_WORKSPACE/oracle-bin"
            python3 "$GITHUB_WORKSPACE/src/util/download_github_release_binary.py" \
              --repo "$REPO" --asset-keywords "$ASSET_KEYWORDS" --binary-name "$BINARY_NAME" \
              "$GITHUB_WORKSPACE/oracle-bin"
            echo "$GITHUB_WORKSPACE/oracle-bin" >> $GITHUB_PATH
          else
            echo "❌ Unsupported fuzzer.oracle_fetch_fallback.type: $FALLBACK_TYPE"
            exit 1
          fi

      - name: Fetch SUT production binary from S3
        id: fetch-sut-binary
        continue-on-error: true
        run: |
          SOLVER="${{ inputs.solver }}"
          NAMESPACE="${{ github.repository }}"
          LATEST_BUILD="${{ needs.check-latest-build.outputs.latest_build }}"
          S3_KEY="$NAMESPACE/solvers/$SOLVER/builds/v2/production/${LATEST_BUILD}.tar.gz"

          mkdir -p artifacts
          if [ "${AWS_STORAGE_PROVIDER:-}" = "r2-broker" ]; then
            HEAD_OK=0; $GITHUB_WORKSPACE/src/util/r2_broker_cli.sh head "$NAMESPACE" "$S3_KEY" || HEAD_OK=1
          else
            HEAD_OK=0; aws s3api head-object --bucket $AWS_BUCKET_NAME --key "$S3_KEY" >/dev/null 2>&1 || HEAD_OK=1
          fi
          if [ "$HEAD_OK" != "0" ]; then
            echo "WARNING: Production binary not found in S3 at key: $S3_KEY"
            echo "sut_binary_available=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${AWS_STORAGE_PROVIDER:-}" = "r2-broker" ]; then
            GET_OK=0; $GITHUB_WORKSPACE/src/util/r2_broker_cli.sh get "$NAMESPACE" "$S3_KEY" artifacts/artifacts.tar.gz || GET_OK=1
          else
            GET_OK=0; aws s3 cp s3://$AWS_BUCKET_NAME/$S3_KEY artifacts/artifacts.tar.gz || GET_OK=1
          fi
          if [ "$GET_OK" != "0" ]; then
            echo "❌ Binary download failed"
            echo "sut_binary_available=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          TARGET_BINARY_RELPATH=$(jq -r '.fuzzer.target_binary_path' "$SOLVER_DIR/manifest.json" | sed 's#^\./##')
          TARGET_BUILD_DIR_RELPATH=$(jq -r '.fuzzer.target_binary_path' "$SOLVER_DIR/manifest.json" | sed 's#^\./build/##')
          mkdir -p "$SOLVER/build"
          "$GITHUB_WORKSPACE/src/util/extract_build_artifacts.sh" artifacts/artifacts.tar.gz $SOLVER/build "$TARGET_BUILD_DIR_RELPATH" false
          if [ ! -f "$SOLVER/$TARGET_BINARY_RELPATH" ]; then
            echo "⚠️ Binary extraction failed"
            echo "sut_binary_available=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          rm -f artifacts/artifacts.tar.gz
          echo "✅ Production binary extracted successfully"
          echo "sut_binary_available=true" >> $GITHUB_OUTPUT

      - name: Clone/build SUT if needed
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          SKIP_IF_CACHED=$(jq -r '.fuzzer.skip_sut_clone_if_binary_cached' "$MANIFEST")
          BINARY_AVAILABLE="${{ steps.fetch-sut-binary.outputs.sut_binary_available }}"

          clone_and_checkout() {
            if [ -d "$SOLVER" ]; then
              echo "$SOLVER directory already exists, skipping clone"
            else
              git clone "${{ inputs.repo_url }}" "$SOLVER"
            fi
            # .cast/ only ever lives on the fork, never in upstream's tree
            # (see .github/actions/clone-solver-source) - layer it in now so
            # the backup/restore below has it to preserve across the
            # checkout, since checking out an upstream commit_hash always
            # wipes it otherwise.
            rm -rf "$SOLVER/.cast" "$SOLVER-profile"
            git clone --depth 1 "${{ github.server_url }}/${{ github.repository }}" "$SOLVER-profile"
            cp -r "$SOLVER-profile/.cast" "$SOLVER/.cast"
            rm -rf "$SOLVER-profile"
            # Mirrors the backup/restore in "Checkout commit to fuzz" above -
            # SOLVER_DIR may point inside this same checkout (e.g.
            # "$SOLVER/.cast"), and that profile isn't guaranteed to exist at
            # every historical commit, so preserve it across the checkout.
            CAST_PROFILE_BACKUP=""
            case "$SOLVER_DIR" in
              "$SOLVER"/*)
                if [ -d "$SOLVER_DIR" ]; then
                  CAST_PROFILE_BACKUP=$(mktemp -d)
                  cp -r "$SOLVER_DIR" "$CAST_PROFILE_BACKUP/profile"
                fi
                ;;
            esac
            (cd "$SOLVER" && git fetch origin && git checkout "${{ needs.commit-fuzzer.outputs.commit_hash }}" && echo "Checked out commit: $(git rev-parse HEAD)")
            if [ -n "$CAST_PROFILE_BACKUP" ]; then
              rm -rf "$SOLVER_DIR"
              mkdir -p "$(dirname "$SOLVER_DIR")"
              cp -r "$CAST_PROFILE_BACKUP/profile" "$SOLVER_DIR"
              rm -rf "$CAST_PROFILE_BACKUP"
            fi
          }

          if [ "$SKIP_IF_CACHED" = "true" ] && [ "$BINARY_AVAILABLE" = "true" ]; then
            echo "✅ $SOLVER binary found, skipping repository clone"
          else
            if [ "$SKIP_IF_CACHED" = "true" ]; then
              echo "⚠️ $SOLVER binary not available, cloning repository for fallback build"
            fi
            clone_and_checkout
            TARGET_BINARY_RELPATH=$(jq -r '.fuzzer.target_binary_path' "$MANIFEST" | sed 's#^\./##')
            if [ ! -f "$SOLVER/$TARGET_BINARY_RELPATH" ]; then
              echo "🔨 Building $SOLVER static binary as fallback (binary not available from S3)"
              "$SOLVER_DIR/build.sh" --static
            else
              echo "✅ Using binary from S3, skipping build"
            fi
          fi

      - name: Clean up git repositories to save space
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            rm -rf "$dir/.git" || true
          done < <(jq -r '.fuzzer.git_cleanup_dirs[]' "$MANIFEST")
          echo "✅ Cleaned up git repositories"

      - name: Verify solver binaries
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          ORACLE_SOLVER="${{ steps.fetch-oracle.outputs.oracle_solver }}"
          TARGET_BINARY_RELPATH=$(jq -r '.fuzzer.target_binary_path' "$SOLVER_DIR/manifest.json" | sed 's#^\./##')
          if [ -n "$ORACLE_SOLVER" ]; then
            "$ORACLE_SOLVER" --version || echo "⚠️ $ORACLE_SOLVER not on PATH"
          fi
          if [ -f "$SOLVER/$TARGET_BINARY_RELPATH" ]; then
            "$SOLVER/$TARGET_BINARY_RELPATH" --version || true
          else
            echo "⚠️ $SOLVER binary not found at $SOLVER/$TARGET_BINARY_RELPATH, skipping verification"
          fi

      - name: Run Simple Fuzzer on assigned tests
        working-directory: ${{ inputs.solver }}
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="../$SOLVER_DIR/manifest.json"
          JOB_START=$(cat /tmp/job_start_${GITHUB_RUN_ID}_${{ matrix.job_id }}.txt)
          STOP_BUFFER=${{ inputs.stop_buffer_minutes || 5 }}

          TESTS_ROOT=$(jq -r '.fuzzer.tests_root' "$MANIFEST")
          TARGET_BINARY_PATH=$(jq -r '.fuzzer.target_binary_path' "$MANIFEST")
          ORACLE_SOLVER=$(jq -r '.fuzzer.oracle_solver // empty' "$MANIFEST")
          MAX_WORKERS=$(jq -r '.fuzzer.resources.max_workers // empty' "$MANIFEST")
          # max_workers is handled above via --workers, and max_jobs is a
          # GitHub Actions matrix fan-out size read by the "Run Commit
          # Fuzzer and create matrix" step, not a RESOURCE_CONFIG key -
          # drop both so simple_commit_fuzzer.py doesn't warn about
          # "unknown" keys on every run.
          RESOURCES_JSON=$(jq -c '(.fuzzer.resources // {}) | del(.max_workers, .max_jobs)' "$MANIFEST")

          ARGS=(
            --tests-json '${{ toJson(matrix.tests) }}'
            --job-id '${{ matrix.job_id }}'
            --tests-root "$TESTS_ROOT"
            --job-start-time "$JOB_START"
            --stop-buffer-minutes "$STOP_BUFFER"
            --iterations 250
            --target-path "$TARGET_BINARY_PATH"
            --resource-config-json "$RESOURCES_JSON"
          )
          if [ -n "$MAX_WORKERS" ]; then
            ARGS+=(--workers "$MAX_WORKERS")
          fi
          if [ -n "$ORACLE_SOLVER" ]; then
            # The S3-fetched/script-fallback paths both place a real binary at
            # oracle-bin/$ORACLE_SOLVER; the pip fallback (see "Install oracle
            # fallback if unavailable") doesn't - it just installs the
            # solver's own package onto PATH, so fall back to the bare name
            # for simple_commit_fuzzer.py's PATH-search resolution.
            if [ -x "$GITHUB_WORKSPACE/oracle-bin/$ORACLE_SOLVER" ]; then
              ORACLE_VALUE="$GITHUB_WORKSPACE/oracle-bin/$ORACLE_SOLVER"
            else
              ORACLE_VALUE="$ORACLE_SOLVER"
            fi
            ARGS+=(--oracle-path "$ORACLE_VALUE")
          fi

          "$GITHUB_WORKSPACE/src/commit_fuzzer/simple_commit_fuzzer.py" "${ARGS[@]}"

      - name: Upload bugs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bugs-job-${{ matrix.job_id }}
          path: ${{ inputs.solver }}/bugs
          retention-days: 1
          if-no-files-found: ignore

  collect-bugs:
    needs: [commit-fuzzer, fuzzer-jobs]
    if: always() && needs.commit-fuzzer.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Download all bug artifacts
        uses: actions/download-artifact@v4
        with:
          path: bugs-artifacts
          pattern: bugs-job-*
          merge-multiple: false

      - name: Combine all bugs
        id: combine-bugs
        run: |
          mkdir -p combined-bugs
          if [ -d "bugs-artifacts" ]; then
            find bugs-artifacts -name "*.smt2" -type f -exec cp {} combined-bugs/ \; 2>/dev/null || true
          else
            echo "No bug artifacts directory found (no bugs were found in any job)"
          fi

          BUG_COUNT=$(find combined-bugs -name "*.smt2" -type f 2>/dev/null | wc -l || echo "0")
          echo "Total bugs found: $BUG_COUNT"
          echo "bug_count=$BUG_COUNT" >> $GITHUB_OUTPUT

          if [ "$BUG_COUNT" -eq 0 ]; then
            echo "✅ No bugs found, skipping upload"
            echo "bugs_found=false" >> $GITHUB_OUTPUT
          else
            echo "bugs_found=true" >> $GITHUB_OUTPUT
            echo "Bugs found:"
            find combined-bugs -name "*.smt2" -type f | sort
          fi

      - name: Create bugs archive
        id: create-archive
        if: steps.combine-bugs.outputs.bugs_found == 'true'
        run: |
          COMMIT_HASH="${{ needs.commit-fuzzer.outputs.commit_hash }}"
          COMMIT_SHORT="${COMMIT_HASH:0:7}"
          TIMESTAMP=$(date +%s)
          ARCHIVE_NAME="bugs-${COMMIT_SHORT}-${TIMESTAMP}.tar.gz"
          cd combined-bugs
          tar -czf ../${ARCHIVE_NAME} .
          cd ..
          ARCHIVE_SIZE=$(du -h ${ARCHIVE_NAME} | cut -f1)
          echo "Created archive: ${ARCHIVE_NAME} ($ARCHIVE_SIZE)"
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Configure storage backend
        if: steps.combine-bugs.outputs.bugs_found == 'true'
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}
          r2_broker_function_url: 'https://e7gghvi6g5gw4gaszvu5wrou6i0annob.lambda-url.eu-north-1.on.aws/'  # see src/infra/r2-broker/README.md
          r2_broker_role_arn: 'arn:aws:iam::615930035042:role/service-role/cast-r2-broker-role-ro68mail'  # see src/infra/r2-broker/README.md
          r2_broker_region: 'eu-north-1'  # see src/infra/r2-broker/README.md

      - name: Validate bugs archive exists
        if: steps.combine-bugs.outputs.bugs_found == 'true'
        run: |
          ARCHIVE_NAME="${{ steps.create-archive.outputs.archive_name }}"
          if [ ! -f "$ARCHIVE_NAME" ]; then
            echo "❌ Error: Archive file not found: $ARCHIVE_NAME"
            exit 1
          fi

      - name: Upload bugs to S3
        if: steps.combine-bugs.outputs.bugs_found == 'true'
        uses: ./.github/actions/s3-put-object
        with:
          key: ${{ github.repository }}/solvers/${{ inputs.solver }}/bugs/${{ steps.create-archive.outputs.archive_name }}
          file: ${{ steps.create-archive.outputs.archive_name }}

      - name: Report upload summary
        if: steps.combine-bugs.outputs.bugs_found == 'true'
        run: |
          echo "Total bugs: ${{ steps.combine-bugs.outputs.bug_count }}"

      - name: No bugs found
        if: steps.combine-bugs.outputs.bugs_found != 'true'
        run: |
          echo "✅ No bugs found in this run, skipping S3 upload"

  update-fuzz-count:
    needs: [check-latest-build, commit-fuzzer, collect-bugs]
    if: always() && needs.commit-fuzzer.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3 requests

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}
          r2_broker_function_url: 'https://e7gghvi6g5gw4gaszvu5wrou6i0annob.lambda-url.eu-north-1.on.aws/'  # see src/infra/r2-broker/README.md
          r2_broker_role_arn: 'arn:aws:iam::615930035042:role/service-role/cast-r2-broker-role-ro68mail'  # see src/infra/r2-broker/README.md
          r2_broker_region: 'eu-north-1'  # see src/infra/r2-broker/README.md

      - name: Increment fuzz count and manage schedule
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          COMMIT_HASH="${{ needs.check-latest-build.outputs.commit_to_fuzz }}"
          NAMESPACE="${{ github.repository }}"
          python src/scheduling/fuzzer.py "${{ inputs.solver }}" --namespace "$NAMESPACE" increment $COMMIT_HASH
